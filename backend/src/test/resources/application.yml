spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  ai:
    openai:
      api-key: test-key

jwt:
  public:
    key: classpath:/app.pub
  private:
    key: classpath:/app.key
  issuer: test-issuer
  token-expiry: 1800
  refresh-token-expiry: 604800

app:
  frontend:
    url: http://localhost:5173